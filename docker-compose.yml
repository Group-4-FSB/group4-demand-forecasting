services:
  mlflow:
    build:
      context: .
      dockerfile: Dockerfile.mlflow
    container_name: demand-forecast-mlflow
    ports:
      - "5000:5000"
    volumes:
      - mlflow_data:/mlflow
    networks:
      - forecast-net
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: demand-forecast-api:latest
    container_name: demand-forecast-api
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
      MLFLOW_EXPERIMENT_NAME: demand-forecast
      MLFLOW_MODEL_NAME: demand-forecast-lgbm
      MLFLOW_MODEL_ALIAS: production
      DATA_PROCESSED_DIR: /app/data/processed
      API_HOST: 0.0.0.0
      API_PORT: "8000"
      LOG_LEVEL: INFO
    ports:
      - "8000:8000"
    volumes:
      # Reference snapshot produced by `python scripts/run_pipeline.py` on the
      # host — see docs/USER_GUIDE.md. Read-only: the API never writes here.
      - ./data/processed:/app/data/processed:ro
    depends_on:
      mlflow:
        condition: service_healthy
    networks:
      - forecast-net
    restart: unless-stopped

  # Business rule: production must never go more than RETRAIN_MAX_AGE_DAYS
  # without an attempted refresh. Checks staleness once a day; reads whatever
  # is currently in data/raw/ (kept fresh by an external ML-engineering data
  # pipeline — out of scope here) and only ever promotes through the same
  # quality gate as a manual `run_pipeline.py` run. Reuses the `api` image —
  # no separate Dockerfile needed.
  scheduler:
    image: demand-forecast-api:latest
    container_name: demand-forecast-scheduler
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
      MLFLOW_EXPERIMENT_NAME: demand-forecast
      MLFLOW_MODEL_NAME: demand-forecast-lgbm
      MLFLOW_MODEL_ALIAS: production
      DATA_RAW_DIR: /app/data/raw
      DATA_PROCESSED_DIR: /app/data/processed
      RETRAIN_MAX_AGE_DAYS: "7"
      RETRAIN_WARNING_LEAD_DAYS: "2"
      LOG_LEVEL: INFO
    volumes:
      # data/raw is read-only here — refreshing it is the ML Engineer's data
      # pipeline's job, not this service's. data/processed and reports/ are
      # written by a promoted retrain, same as a manual run_pipeline.py call.
      - ./data/raw:/app/data/raw:ro
      - ./data/processed:/app/data/processed
      - ./reports:/app/reports
    command: ["python", "scripts/retrain_if_stale.py", "--loop", "--check-interval-hours", "24"]
    healthcheck:
      disable: true
    depends_on:
      api:
        condition: service_started
    networks:
      - forecast-net
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: demand-forecast-prometheus
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/alert_rules.yml:/etc/prometheus/alert_rules.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
    ports:
      - "9090:9090"
    depends_on:
      - api
    networks:
      - forecast-net
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.1.0
    container_name: demand-forecast-grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    networks:
      - forecast-net
    restart: unless-stopped

networks:
  forecast-net:
    driver: bridge

volumes:
  mlflow_data:
  prometheus_data:
  grafana_data:
