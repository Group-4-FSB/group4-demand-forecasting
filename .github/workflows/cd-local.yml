name: CD Local

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-local:
    name: Deploy to Local (self-hosted)
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: [self-hosted, macOS]
    steps:
      - name: Checkout source at tested commit
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - name: Verify Docker engine
        run: docker info >/dev/null

      - name: Deploy stack on local machine
        run: |
          set -euo pipefail
          docker compose up -d --build mlflow api scheduler prometheus grafana

      - name: Wait for API health endpoint
        run: |
          set -euo pipefail
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8000/health >/dev/null; then
              echo "Health endpoint is reachable"
              exit 0
            fi
            sleep 3
          done
          echo "API health endpoint did not become reachable"
          exit 1

      - name: Bootstrap model if not loaded
        env:
          DATASET_ZIP_PATH: ${{ secrets.WALMART_SALES_ZIP_PATH }}
        run: |
          set -euo pipefail
          health_json="$(curl -fsS http://localhost:8000/health)"
          echo "Initial health payload: ${health_json}"
          compact_json="$(echo "${health_json}" | tr -d '[:space:]')"

          if echo "${compact_json}" | grep -q '"model_loaded":true'; then
            echo "A production model is already loaded. Skipping bootstrap training."
            exit 0
          fi

          if [ ! -f "data/raw/Walmart_Sales.csv" ]; then
            echo "Raw CSV missing in workspace. Trying setup_data.py..."
            command -v python3 >/dev/null
            if [ -f "walmart_sales.zip" ]; then
              python3 scripts/setup_data.py
            elif [ -n "${DATASET_ZIP_PATH:-}" ] && [ -f "${DATASET_ZIP_PATH}" ]; then
              python3 scripts/setup_data.py --zip "${DATASET_ZIP_PATH}"
            else
              echo "ERROR: Missing data/raw/Walmart_Sales.csv and no dataset zip available." >&2
              echo "Place walmart_sales.zip at repo root, or set secret WALMART_SALES_ZIP_PATH to an absolute zip path on the self-hosted runner machine." >&2
              exit 1
            fi
          fi

          echo "No loaded model detected. Running bootstrap training..."
          docker compose run --rm trainer python scripts/run_pipeline.py
          docker compose restart api

      - name: Wait for model-ready health
        run: |
          set -euo pipefail
          for i in $(seq 1 40); do
            health_json="$(curl -fsS http://localhost:8000/health || true)"
            compact_json="$(echo "${health_json}" | tr -d '[:space:]')"

            if echo "${compact_json}" | grep -q '"model_loaded":true'; then
              echo "Model-ready health check passed"
              exit 0
            fi

            sleep 3
          done

          echo "Model did not become loaded after bootstrap/restart"
          docker compose logs --tail=200 api || true
          exit 1

      - name: Prediction smoke test
        run: |
          set -euo pipefail
          curl -fsS -X POST http://localhost:8000/api/v1/predict \
            -H "Content-Type: application/json" \
            -d '{"store_nbr": 1, "date": "2012-12-28"}' >/dev/null
          echo "Prediction smoke test passed"
