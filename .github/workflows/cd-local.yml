name: CD Local

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  contents: read

jobs:
  deploy-local:
    name: Deploy to Local (self-hosted)
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: self-hosted
    steps:
      - name: Checkout source at tested commit
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Verify Docker engine
        run: docker info >/dev/null

      - name: Deploy stack on local machine
        run: |
          set -euo pipefail
          docker compose up -d --build mlflow api scheduler prometheus grafana

      - name: Health check
        run: |
          set -euo pipefail
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8000/health >/dev/null; then
              echo "Local deploy health check passed"
              exit 0
            fi
            sleep 3
          done
          echo "Local deploy health check failed"
          exit 1
